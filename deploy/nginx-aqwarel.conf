# ============================================================
#  /etc/nginx/sites-available/aqwarel
#  Reverse proxy nginx -> Node.js (PM2) sur 127.0.0.1:3000
#
#  Installation :
#    sudo cp deploy/nginx-aqwarel.conf /etc/nginx/sites-available/aqwarel
#    sudo ln -s /etc/nginx/sites-available/aqwarel /etc/nginx/sites-enabled/
#    sudo rm /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d aqwarel.com -d www.aqwarel.com
# ============================================================

# Redirect HTTP -> HTTPS (Certbot écrira ce bloc, on le pré-configure)
server {
    listen 80;
    listen [::]:80;
    server_name aqwarel.com www.aqwarel.com;

    # Pour le challenge Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aqwarel.com www.aqwarel.com;

    # ── SSL (Certbot remplira ces lignes après certbot --nginx)
    # ssl_certificate     /etc/letsencrypt/live/aqwarel.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aqwarel.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Sécurité (HSTS, sniffing, clickjacking)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Tailles
    client_max_body_size 10M;

    # ── Logs
    access_log /var/log/nginx/aqwarel.access.log;
    error_log  /var/log/nginx/aqwarel.error.log;

    # ── Reverse proxy vers Node
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
